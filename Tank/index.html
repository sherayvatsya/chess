<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tribute to Indian Army</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1> A Tribute to Indian Army </h1>

<div class="scene">

    <div class="flag"></div>

    <div class="tank">
        <div class="turret"></div>
        <div class="gun"></div>
        <div class="bullet"></div>
        <div class="explosion"></div>
        <div class="body"></div>
        <div class="track"></div>
    </div>

</div>

<button onclick="fire()">Fire 🔥</button>
<button onclick="runTank()">Run Tank 🚜</button>
<button onclick="moveTurret()">Move Turret 🎯</button>
<button onclick="stopTank()">Stop Tank 🛑</button>



<script src="script.js"></script>
</body>
</html>
